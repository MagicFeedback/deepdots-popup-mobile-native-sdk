# Native test apps (MF-3244): builds the NORDLY apps against PUBLISHED SDK versions
# (Android: Maven Central, iOS: MagicFeedback/DeepdotsSDK-SPM), runs the Maestro suite on an
# emulator / simulator against DEV (MAGICFEEDBACK_DEV) and keeps logs, JUnit and videos.
# Docs: test-apps/README.md
#
# On a pull request it runs a SHORT suite: the latest version in sdk-versions.json only, and only
# the flows the PR adds or changes plus a smoke test (00-version, checkout-time). The apps use the
# published SDK, so the other flows would re-test the same binaries that already passed on dev.
# The full suite (every flow, every version) runs from "Run workflow" or locally (README, "Run").
#
# Visual regression (DD-28): the `visual/` flows also run on a small screen (Android: the same
# emulator at 720x1280; iOS: an iPhone SE simulator), and the jobs "Visual regression · Android /
# iOS · SDK local" compare their screenshots with the approved baselines of test-apps/visual
# (test-apps/visual/README.md). They run when `local` is tested: the release PR (release-check.yml)
# and every Monday (visual flows only). Nothing here ever approves a baseline.
name: Test apps

on:
  pull_request:
    paths:
      - "test-apps/**"
      - ".github/workflows/test-apps.yml"
  # release-check.yml calls it on release PRs with ["local"] (DD-25).
  workflow_call:
    inputs:
      versions:
        type: string
        required: true
  schedule:
    # Mondays: the visual flows on the SDK built from dev (`local`).
    - cron: "15 5 * * 1"
  workflow_dispatch:
    inputs:
      flows:
        description: "Flows to run, space-separated, relative to test-apps/maestro (e.g. visual/*.yaml). Empty: all"
        default: ""
      versions:
        description: "SDK versions, JSON list (published versions; Android also accepts \"local\"). Empty: test-apps/sdk-versions.json"
        default: ""
      record:
        description: "Record one video per flow"
        type: boolean
        default: false

concurrency:
  group: test-apps-${{ github.ref }}-${{ inputs.versions }}
  cancel-in-progress: true

jobs:
  versions:
    name: SDK versions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
      flows: ${{ steps.pick.outputs.flows }}
      visual: ${{ steps.pick.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          INPUT: ${{ inputs.versions }}
          INPUT_FLOWS: ${{ inputs.flows }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          LIST=${INPUT:-$(jq -c .versions test-apps/sdk-versions.json)}
          FLOWS=""
          if [ "$EVENT" = schedule ]; then
            LIST='["local"]'
            INPUT_FLOWS='visual/*.yaml'
          fi
          # Globs expanded here, so the jobs get the file list.
          [ -n "$INPUT_FLOWS" ] && FLOWS=$(cd test-apps/maestro && ls $INPUT_FLOWS | tr '\n' ' ')
          # A caller passing versions (release-check on a release PR: ["local"]) gets the full suite.
          if [ -n "$PR" ] && [ -z "$INPUT" ]; then
            # Short suite: latest version, smoke + the flows this PR adds or changes (subflows are
            # shared, so a change there only gets the smoke test: run the full suite locally).
            LIST=$(jq -c '.versions[:1]' test-apps/sdk-versions.json)
            CHANGED=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
              --jq '.[] | select(.status != "removed") | .filename' \
              | sed -n 's#^test-apps/maestro/##p' | grep -E '\.yaml$' | grep -vE '(^|/)subflows/|^config\.yaml$' || true)
            FLOWS=$(printf '%s\n' flows/00-version.yaml flows/checkout-time.yaml $CHANGED | awk 'NF && !seen[$0]++' | tr '\n' ' ')
            echo "[lab] pull request: short suite. Full suite: Run workflow, or locally (test-apps/README.md)"
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "flows=$FLOWS" >> "$GITHUB_OUTPUT"
          # Visual flows of this run (empty FLOWS = all of them): what the small-screen pass runs.
          VISUAL=$(if [ -z "$FLOWS" ]; then cd test-apps/maestro && ls visual/*.yaml; else printf '%s\n' $FLOWS | grep '^visual/' || true; fi | tr '\n' ' ')
          echo "visual=$VISUAL" >> "$GITHUB_OUTPUT"
          echo "[lab] visual flows: ${VISUAL:-none}"
          echo "[lab] SDK versions: $LIST"
          echo "[lab] flows: ${FLOWS:-all}"
          # A new release that nobody added to the list yet.
          LATEST=$(curl -fsS https://repo1.maven.org/maven2/com/deepdots/sdk/shared-android/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          if [ -n "$LATEST" ] && ! jq -e --arg v "$LATEST" '.versions | index($v)' test-apps/sdk-versions.json > /dev/null; then
            echo "::warning::[lab] SDK $LATEST is published but not in test-apps/sdk-versions.json"
          fi

  android:
    name: Android · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    # `local` is the release gate (release-check.yml): the FULL suite, ~48 flows at ~1.3 min on this
    # emulator plus the build of the SDK. A published version on a PR runs the short suite.
    timeout-minutes: ${{ matrix.sdk == 'local' && 120 || 60 }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build apps (SDK ${{ matrix.sdk }})
        working-directory: test-apps/android
        # :basic is the minimal host app (init + attachContext + setPath only), for maestro/basic.
        run: ./gradlew :app:assembleDebug :basic:assembleDebug :app:labSdkInfo -PsdkVersion=${{ matrix.sdk }}
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RECORD: ${{ inputs.record && '1' || '0' }}
          FLOWS: ${{ needs.versions.outputs.flows }}
          VISUAL_FLOWS: ${{ needs.versions.outputs.visual }}
          AVD_PROFILE: pixel_6
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r test-apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r test-apps/android/basic/build/outputs/apk/debug/basic-debug.apk
            # The runner executes each line on its own: suite + visual small-screen pass (DD-28: the same
            # emulator at 720x1280 / 320 dpi) in one line, so a failure of either fails the step.
            test-apps/scripts/run-maestro.sh android ${{ matrix.sdk }} out/android-${{ matrix.sdk }}; code=$?; if [ -n "$VISUAL_FLOWS" ]; then adb shell wm size 720x1280; adb shell wm density 320; AVD_PROFILE=small-720x1280 FLOWS="$VISUAL_FLOWS" test-apps/scripts/run-maestro.sh android ${{ matrix.sdk }} out/android-${{ matrix.sdk }}/small || code=1; adb shell wm size reset; adb shell wm density reset; fi; exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-apps-android-${{ matrix.sdk }}
          path: out/android-${{ matrix.sdk }}
          retention-days: 14

  ios:
    name: iOS · SDK ${{ matrix.sdk }}
    runs-on: macos-15
    # `local` is the release gate: it builds the SDK from this commit first (Kotlin/Native, ~15 min)
    # and runs the FULL suite (~48 flows at ~2 min on this runner). A PR runs the short suite.
    timeout-minutes: ${{ matrix.sdk == 'local' && 150 || 90 }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: actions/setup-java@v4
        if: matrix.sdk == 'local'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.sdk == 'local'
      - name: Install tools
        run: |
          brew install xcodegen
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # The release PR (release-check.yml, versions ["local"]): the iOS test app on the SDK built
      # from this commit, as a local Swift package, instead of a published DeepdotsSDK-SPM version.
      - name: Build the SDK from this commit (local)
        if: matrix.sdk == 'local'
        run: test-apps/scripts/ios-local-sdk.sh
      - name: Generate and build app (SDK ${{ matrix.sdk }})
        working-directory: test-apps/ios
        run: |
          SDK_VERSION=${{ matrix.sdk }} xcodegen generate
          xcodebuild -project NordlyTestApp.xcodeproj -scheme NordlyTestApp -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build -quiet build
          if [ "${{ matrix.sdk }}" = local ]; then
            echo "[lab] sdk requested=local resolved=$(git rev-parse --short HEAD) source=local spm-local (built from this commit)"
          else
            RESOLVED=$(python3 -c "import json;print(next(p['state']['version'] for p in json.load(open('NordlyTestApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'))['pins'] if p['identity']=='deepdotssdk-spm'))")
            echo "[lab] sdk requested=${{ matrix.sdk }} resolved=$RESOLVED source=SPM (DeepdotsSDK-SPM)"
            test "$RESOLVED" = "${{ matrix.sdk }}"
          fi
      - name: Generate and build the minimal host app (SDK ${{ matrix.sdk }})
        if: matrix.sdk != 'local'
        working-directory: test-apps/basic-ios
        run: |
          SDK_VERSION=${{ matrix.sdk }} xcodegen generate
          xcodebuild -project BasicApp.xcodeproj -scheme BasicApp -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build -quiet build
      - name: Boot simulator and install
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name']=='iPhone 16'))")
          echo "DEVICE=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" test-apps/ios/build/Build/Products/Debug-iphonesimulator/NordlyTestApp.app
          # The minimal host app is only built for published versions (not on `local`).
          BASIC=test-apps/basic-ios/build/Build/Products/Debug-iphonesimulator/BasicApp.app
          if [ -d "$BASIC" ]; then xcrun simctl install "$UDID" "$BASIC"; fi
      - name: Run suite on the simulator
        env:
          RECORD: ${{ inputs.record && '1' || '0' }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
          FLOWS: ${{ needs.versions.outputs.flows }}
        run: test-apps/scripts/run-maestro.sh ios ${{ matrix.sdk }} out/ios-${{ matrix.sdk }}
      # Visual regression, small screen (DD-28): the visual flows again on an iPhone SE.
      - name: Visual flows on a small screen (iPhone SE)
        if: always() && needs.versions.outputs.visual != ''
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
          FLOWS: ${{ needs.versions.outputs.visual }}
        run: |
          xcrun simctl shutdown "$DEVICE" || true
          SE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name']=='iPhone SE (3rd generation)'))")
          xcrun simctl boot "$SE" && xcrun simctl bootstatus "$SE" -b
          xcrun simctl install "$SE" test-apps/ios/build/Build/Products/Debug-iphonesimulator/NordlyTestApp.app
          DEVICE=$SE test-apps/scripts/run-maestro.sh ios ${{ matrix.sdk }} out/ios-${{ matrix.sdk }}/small
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-apps-ios-${{ matrix.sdk }}
          path: out/ios-${{ matrix.sdk }}
          retention-days: 14

  # Visual regression (DD-28): the screenshots of the `local` run against the approved baselines
  # (test-apps/visual/baselines, approvals.json). On a short PR suite only the captured states
  # are checked; the release PR and the Monday run check every baseline. One job per platform
  # (not a matrix), so the check name is fixed even when the job is skipped: the release gate
  # (scripts/release/required-checks.mjs) matches it exactly.
  visual-android:
    name: Visual regression · Android · SDK local
    needs: [versions, android]
    if: always() && contains(needs.versions.outputs.list, '"local"') && needs.versions.outputs.visual != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix scripts/visual
      - uses: actions/download-artifact@v4
        with:
          name: test-apps-android-local
          path: run
      - name: Compare with the approved baselines
        env:
          PARTIAL: ${{ needs.versions.outputs.flows != '' && !startsWith(needs.versions.outputs.flows, 'visual/') && '--captured-only' || '' }}
        run: |
          for d in run run/small; do [ -f "$d/device.json" ] && node test-apps/visual/collect.mjs --run "$d" --dest actual --sdk local; done
          node scripts/visual/check.mjs --suite test-apps/visual --actual actual --out visual-report \
            --title "Visual regression · Android" $PARTIAL
      - name: Summary
        if: always()
        run: cat visual-report/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No visual summary (no screenshots)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report-android-local
          path: visual-report
          retention-days: 30

  visual-ios:
    name: Visual regression · iOS · SDK local
    needs: [versions, ios]
    if: always() && contains(needs.versions.outputs.list, '"local"') && needs.versions.outputs.visual != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix scripts/visual
      - uses: actions/download-artifact@v4
        with:
          name: test-apps-ios-local
          path: run
      - name: Compare with the approved baselines
        env:
          PARTIAL: ${{ needs.versions.outputs.flows != '' && !startsWith(needs.versions.outputs.flows, 'visual/') && '--captured-only' || '' }}
        run: |
          for d in run run/small; do [ -f "$d/device.json" ] && node test-apps/visual/collect.mjs --run "$d" --dest actual --sdk local; done
          node scripts/visual/check.mjs --suite test-apps/visual --actual actual --out visual-report \
            --title "Visual regression · iOS" $PARTIAL
      - name: Summary
        if: always()
        run: cat visual-report/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No visual summary (no screenshots)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report-ios-local
          path: visual-report
          retention-days: 30
