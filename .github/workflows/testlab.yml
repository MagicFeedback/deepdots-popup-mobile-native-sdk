name: Test Lab (real devices)

# DD-273: the key popup checks on real phones and tablets in Firebase Test Lab.
# - Android: shared/src/androidInstrumentedTest (PopupDeviceChecksTest, real WebView).
# - iOS: test-apps/ios/NordlyDeviceChecks (XCUITest on NORDLY, SDK of this commit).
# - Devices: testlab/devices.json (fixed list). Runner: testlab/testlab.py.
#
# Runs only on release PRs (head branch release/X.Y.Z) and by hand (Actions > Run workflow).
# The 57 Maestro flows stay on emulators (test-apps.yml).
#
# Cost guardrails: fixed devices, 10 min timeout per matrix, no automatic retries, a new push
# cancels the old run (and its Test Lab matrices), billed minutes in the job summary. The Firebase
# project has its own $30/month budget with alerts (see testlab/README.md).
#
# Secrets: TEST_LAB_PROJECT_ID (Firebase project id) and TEST_LAB_SA_KEY (JSON key of the service
# account). Without them the jobs skip with a notice: nothing is billed.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: testlab-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  XCODE_APP: /Applications/Xcode_16.4.app
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  gate:
    name: Test Lab gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.gate.outputs.android }}
      ios: ${{ steps.gate.outputs.ios }}
    steps:
      - id: gate
        env:
          HAS_PROJECT: ${{ secrets.TEST_LAB_PROJECT_ID != '' }}
          HAS_KEY: ${{ secrets.TEST_LAB_SA_KEY != '' }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
        run: |
          if [ "$HAS_PROJECT" != true ] || [ "$HAS_KEY" != true ]; then
            msg="Test Lab skipped: set the repo secrets TEST_LAB_PROJECT_ID and TEST_LAB_SA_KEY (testlab/README.md). Nothing was run or billed."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "android=false" >> "$GITHUB_OUTPUT"; echo "ios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$PLATFORMS" = ios ] && echo "android=false" >> "$GITHUB_OUTPUT" || echo "android=true" >> "$GITHUB_OUTPUT"
          [ "$PLATFORMS" = android ] && echo "ios=false" >> "$GITHUB_OUTPUT" || echo "ios=true" >> "$GITHUB_OUTPUT"

  android:
    name: Test Lab · Android
    needs: gate
    if: needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TESTLAB_MATRIX_FILE: ${{ github.workspace }}/testlab-matrices.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the instrumented test APK
        run: ./gradlew :shared:assembleDebugAndroidTest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.TEST_LAB_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Run on real devices
        timeout-minutes: 25
        env:
          PROJECT: ${{ secrets.TEST_LAB_PROJECT_ID }}
          LABEL: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 testlab/testlab.py android --project "$PROJECT" --label "$LABEL" \
            --apk shared/build/outputs/apk/androidTest/debug/shared-debug-androidTest.apk

      # A cancelled job (new push, timeout) does not stop the matrix in Test Lab: cancel it here.
      - name: Cancel the Test Lab matrix
        if: cancelled() || failure()
        env:
          PROJECT: ${{ secrets.TEST_LAB_PROJECT_ID }}
        run: |
          [ -f "$TESTLAB_MATRIX_FILE" ] || exit 0
          while read -r platform matrix; do
            gcloud firebase test "$platform" cancel "$matrix" --project "$PROJECT" || true
          done < "$TESTLAB_MATRIX_FILE"

  ios:
    name: Test Lab · iOS
    needs: gate
    if: needs.gate.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TESTLAB_MATRIX_FILE: ${{ github.workspace }}/testlab-matrices.txt
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen

      # SDK of this commit (device slice) + NORDLY + the XCUITests, signed ad hoc (Test Lab
      # re-signs them). Set SIGN_IDENTITY here if Test Lab ever rejects the ad hoc signature.
      - name: Build the XCUITest zip for devices
        run: testlab/ios-build.sh device out/testlab

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.TEST_LAB_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Run on real devices
        timeout-minutes: 25
        env:
          PROJECT: ${{ secrets.TEST_LAB_PROJECT_ID }}
          LABEL: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 testlab/testlab.py ios --project "$PROJECT" --label "$LABEL" \
            --zip out/testlab/ios-tests.zip

      - name: Cancel the Test Lab matrix
        if: cancelled() || failure()
        env:
          PROJECT: ${{ secrets.TEST_LAB_PROJECT_ID }}
        run: |
          [ -f "$TESTLAB_MATRIX_FILE" ] || exit 0
          while read -r platform matrix; do
            gcloud firebase test "$platform" cancel "$matrix" --project "$PROJECT" || true
          done < "$TESTLAB_MATRIX_FILE"
