name: Release

# Release completo del SDK al subir un tag `vX.Y.Z`. Sustituye a `scripts/deploy_sdk_release.sh`
# (rutas locales, subida manual al portal de Sonatype y un update_version.sh que recreaba tags).
#
# Flujo de release (docs/VERSIONING.md):
#   1. `node scripts/release.mjs prepare patch|minor|major`: PR a dev con la version, la seccion
#      `## X.Y.Z - fecha` del CHANGELOG y release/compatibility.json. Su "Release dry run"
#      (release-check.yml) corre este mismo gate, tests y build antes de que exista el tag.
#   2. Fusionada la PR: `node scripts/release.mjs tag` (sube el tag vX.Y.Z).
#
# Antes de publicar nada, el gate (MF-3242, scripts/release/check.mjs release) bloquea si falta
# el bump, las release notes o el manifiesto de compatibilidad es invalido, y metadata.mjs
# bloquea si el "Release dry run" de la PR de release no esta en verde. El AAR y el zip del
# XCFramework se construyen UNA vez, pasan la prueba de humo y se publican ESOS ficheros.
#
# Que publica, por orden (si un paso falla, los siguientes no corren):
#   - Android en Maven Central (`com.deepdots.sdk:shared-android:X.Y.Z`), firmado.
#     Se SALTA con un aviso si faltan los secrets de Maven Central o de firma.
#   - iOS: XCFramework en la release `X.Y.Z` de MagicFeedback/DeepdotsSDK-SPM + Package.swift.
#   - GitHub Release `vX.Y.Z` en este repo con el AAR, el zip del XCFramework, SHA256SUMS,
#     release.json (commit, hashes, donde se publico, dry-run, aprobacion), el manifiesto y el
#     schema de configuracion; y las notas del CHANGELOG.
#   - Merge del commit del tag en `main` (+ redeploy de la doc). Con conflicto, abre una PR.
#     Un parche de una linea antigua (o una prerelease) no se fusiona ni se marca como latest.
# Ningun paso sobrescribe algo ya publicado: si la version existe, se salta.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SPM_REPO_TOKEN          PAT fine-grained con Contents: read/write en DeepdotsSDK-SPM.
#   MAVEN_CENTRAL_USERNAME  usuario del user token de central.sonatype.com (Account > Generate User Token).
#   MAVEN_CENTRAL_PASSWORD  password de ese user token.
#   SIGNING_KEY             clave GPG privada en ASCII armor (`gpg --armor --export-secret-keys <id>`).
#   SIGNING_PASSWORD        passphrase de esa clave.
#   SIGNING_KEY_ID          (opcional) id corto de la clave.
# Variables (opcionales):
#   MAVEN_CENTRAL_PUBLISHING_TYPE  automatic (default: publica sin pasar por el portal) o user_managed
#                                  (deja el deployment en el portal para darle a Publish a mano).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: write # lanzar docs-pages.yml tras fusionar en main
  pull-requests: write # PR de respaldo si el merge en main da conflicto
  checks: read # metadata.mjs lee el "Release dry run" de la PR de release

concurrency:
  group: release
  cancel-in-progress: false

# Mismas versiones que el dry-run de release-check.yml: cambiarlas siempre en los dos.
env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  XCODE_APP: /Applications/Xcode_16.4.app
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  SPM_REPO: MagicFeedback/DeepdotsSDK-SPM
  ARTIFACT_GROUP_PATH: com/deepdots/sdk/shared-android

jobs:
  release:
    name: Build & publish
    # Hace falta macOS: Kotlin/Native, xcodebuild y el simulador de iOS.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::La imagen no trae $XCODE_APP. Cambia XCODE_APP aqui y en release-check.yml (a la vez)."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json

      - name: Install release tools
        run: npm ci --prefix scripts/release

      # Gate de release (MF-3242, docs/VERSIONING.md). Si falla, no se publica nada: tag =
      # version, bump respecto a lo publicado en su linea, notas en el CHANGELOG y manifiesto de
      # compatibilidad valido (schema, versiones contrastadas con el codigo, fixtures).
      - name: Release gate
        id: meta
        run: |
          set -euo pipefail
          # Se releasea desde dev: un tag sobre un commit que no esta en dev es un error.
          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::El commit del tag $GITHUB_REF_NAME no esta en origin/dev."
            exit 1
          fi
          node scripts/release/check.mjs release --tag "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/changelog.md"

      - name: Check what is already published
        id: state
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          HAS_MAVEN_CREDS: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.MAVEN_CENTRAL_PASSWORD != '' && secrets.SIGNING_KEY != '' && secrets.SIGNING_PASSWORD != '' }}
        run: |
          set -euo pipefail
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/$ARTIFACT_GROUP_PATH/$VERSION/shared-android-$VERSION.pom")"
          if [ "$CODE" = "200" ]; then
            echo "maven=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::shared-android $VERSION ya esta en Maven Central."
          elif [ "$HAS_MAVEN_CREDS" != "true" ]; then
            echo "maven=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan secrets de Maven Central o de firma: Android NO se publica en Maven Central (solo AAR en la GitHub Release)."
          else
            echo "maven=publish" >> "$GITHUB_OUTPUT"
          fi
          if git ls-remote --exit-code --tags "https://github.com/$SPM_REPO.git" "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "spm=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::$SPM_REPO ya tiene el tag $VERSION; no se toca (cambiar un binario publicado rompe el checksum de quien ya lo resolvio)."
          else
            echo "spm=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Por defecto instala tambien el paquete `tools`, que Google retiro: el sdkmanager actual
          # no lo encuentra y el paso falla. La plataforma y las build-tools las baja Gradle.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests (JVM)
        run: ./gradlew :shared:testDebugUnitTest

      - name: Unit tests (iOS simulator)
        run: |
          set -euo pipefail
          # El plugin de Kotlin elige un modelo de iPhone que no tiene por que existir en esta
          # imagen de macOS; se le pasa uno que si.
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"] if phones else "")
          ')"
          if [ -z "$UDID" ]; then echo "::error::No hay ningun simulador de iPhone disponible."; exit 1; fi
          ./gradlew :shared:iosSimulatorArm64Test "-PiosTestDevice=$UDID"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: shared/build/reports/tests/
          retention-days: 7

      # El AAR se construye UNA vez, en el staging repo de Maven (firmado si hay secrets): ese
      # fichero es el del bundle de Maven Central y el que se adjunta a la GitHub Release.
      - name: Build Android AAR
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNING_KEY: ${{ steps.state.outputs.maven == 'publish' && secrets.SIGNING_KEY || '' }}
          SIGNING_PASSWORD: ${{ steps.state.outputs.maven == 'publish' && secrets.SIGNING_PASSWORD || '' }}
          SIGNING_KEY_ID: ${{ steps.state.outputs.maven == 'publish' && secrets.SIGNING_KEY_ID || '' }}
        run: |
          set -euo pipefail
          rm -rf build/release-staging-repo
          ./gradlew :shared:publishAndroidReleasePublicationToReleaseStagingRepository
          mkdir -p "$RUNNER_TEMP/out"
          cp "build/release-staging-repo/$ARTIFACT_GROUP_PATH/$VERSION/shared-android-$VERSION.aar" "$RUNNER_TEMP/out/DeepdotsSDK-$VERSION.aar"

      # El zip del XCFramework tambien se construye una vez; su sha256 es el checksum de SPM. Si
      # SPM ya tiene la version (re-ejecucion), el artefacto es el publicado: se descarga ese.
      - name: Build iOS XCFramework
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="DeepdotsSDK-$VERSION.xcframework.zip"
          if [ "${{ steps.state.outputs.spm }}" = "publish" ]; then
            scripts/prepare_spm_release.sh "$VERSION" "https://github.com/$SPM_REPO/releases/download/$VERSION"
            cp "dist/spm/$ZIP" "$RUNNER_TEMP/out/"
          else
            curl -fsSL -o "$RUNNER_TEMP/out/$ZIP" "https://github.com/$SPM_REPO/releases/download/$VERSION/$ZIP"
          fi
          echo "checksum=$(shasum -a 256 "$RUNNER_TEMP/out/$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Smoke test the artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/release/smoke.mjs --aar "$RUNNER_TEMP/out/DeepdotsSDK-$VERSION.aar" \
            --xcframework "$RUNNER_TEMP/out/DeepdotsSDK-$VERSION.xcframework.zip" --json "$RUNNER_TEMP/smoke.json"

      # Antes de publicar: el AAR del bundle es el probado, el checksum de SPM es el del zip
      # probado y el "Release dry run" de la PR de release esta en verde. Si no, no se publica.
      - name: Check traceability
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/release/metadata.mjs --require-ci --tag "$GITHUB_REF_NAME" \
            --aar "$RUNNER_TEMP/out/DeepdotsSDK-$VERSION.aar" --xcframework "$RUNNER_TEMP/out/DeepdotsSDK-$VERSION.xcframework.zip" \
            --spm-checksum "$checksum" --maven-dir build/release-staging-repo --smoke "$RUNNER_TEMP/smoke.json" \
            --out "$RUNNER_TEMP/release.pre.json"

      # Firma en local y sube el bundle por la API del Central Portal, en UNA peticion. La via
      # "compatible con OSSRH" (publish...ToOSSRHRepository + /manual/upload) aisla los
      # repositorios por IP, y los runners de macOS salen por varias: la subida de v0.6.1 quedo
      # repartida en dos repositorios y el aviso al portal llego desde una tercera IP.
      - name: Publish to Maven Central
        if: steps.state.outputs.maven == 'publish'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: ${{ vars.MAVEN_CENTRAL_PUBLISHING_TYPE || 'automatic' }}
        run: |
          set -euo pipefail
          # El staging repo ya esta construido y firmado ("Build Android AAR"): no se reconstruye.
          DIR="build/release-staging-repo/$ARTIFACT_GROUP_PATH/$VERSION"
          ls -1 "$DIR"
          for f in "shared-android-$VERSION.aar" "shared-android-$VERSION.pom" "shared-android-$VERSION.aar.asc" "shared-android-$VERSION.pom.asc"; do
            [ -f "$DIR/$f" ] || { echo "::error::Falta $f en el bundle (¿no se ha firmado?)."; exit 1; }
          done
          BUNDLE="$RUNNER_TEMP/shared-android-$VERSION-bundle.zip"
          (cd build/release-staging-repo && zip -qr "$BUNDLE" "$ARTIFACT_GROUP_PATH/$VERSION")
          case "$PUBLISHING_TYPE" in
            automatic) TYPE=AUTOMATIC ;;
            user_managed) TYPE=USER_MANAGED ;;
            *) echo "::error::MAVEN_CENTRAL_PUBLISHING_TYPE no valido: $PUBLISHING_TYPE"; exit 1 ;;
          esac
          AUTH="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          API=https://central.sonatype.com/api/v1/publisher
          ID="$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $AUTH" \
            -F "bundle=@$BUNDLE;type=application/octet-stream" \
            "$API/upload?publishingType=$TYPE&name=shared-android-$VERSION")"
          echo "Deployment $ID ($TYPE)"
          # Esperar a que el portal valide el bundle: si lo rechaza (firma, POM, checksums), que
          # el release falle aqui y no se publiquen SPM ni la GitHub Release.
          for i in $(seq 1 60); do
            sleep 10
            STATUS="$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $AUTH" "$API/status?id=$ID")"
            STATE="$(echo "$STATUS" | jq -r .deploymentState)"
            echo "  $STATE"
            case "$STATE" in
              VALIDATED|PUBLISHING|PUBLISHED) break ;;
              FAILED) echo "$STATUS" | jq .; echo "::error::Maven Central ha rechazado el bundle."; exit 1 ;;
            esac
          done
          case "$STATE" in
            VALIDATED) echo "::notice::shared-android $VERSION validado en Maven Central: falta darle a Publish en central.sonatype.com > Deployments." ;;
            PUBLISHING|PUBLISHED) echo "::notice::shared-android $VERSION publicandose en Maven Central; tarda unos minutos en aparecer en repo1.maven.org." ;;
            *) echo "::error::El deployment $ID sigue en $STATE tras 10 min."; exit 1 ;;
          esac

      - name: Checkout SPM repo
        if: steps.state.outputs.spm == 'publish'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SPM_REPO }}
          token: ${{ secrets.SPM_REPO_TOKEN }}
          path: spm-repo

      - name: Publish SPM release
        if: steps.state.outputs.spm == 'publish'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.SPM_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/out/DeepdotsSDK-$VERSION.xcframework.zip"
          URL="https://github.com/$SPM_REPO/releases/download/$VERSION/DeepdotsSDK-$VERSION.xcframework.zip"
          cd spm-repo
          sed -i '' \
            -e "s|url: \".*\"|url: \"$URL\"|" \
            -e "s|checksum: \".*\"|checksum: \"$checksum\"|" \
            Package.swift
          grep -E 'url:|checksum:' Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          # Release en borrador con el binario ANTES de empujar el tag: asi el Package.swift del
          # tag nunca apunta a una URL que aun da 404.
          gh release create "$VERSION" "$ZIP" --repo "$SPM_REPO" --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/changelog.md" --target main --draft
          git push origin HEAD:main "refs/tags/$VERSION"
          gh release edit "$VERSION" --repo "$SPM_REPO" --draft=false --latest --verify-tag

      - name: Verify SPM resolves
        if: steps.state.outputs.spm == 'publish'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CHECK="$RUNNER_TEMP/spm-check"
          mkdir -p "$CHECK/Sources/Check"
          echo "" > "$CHECK/Sources/Check/Check.swift"
          cat > "$CHECK/Package.swift" <<EOF
          // swift-tools-version: 5.7
          import PackageDescription
          let package = Package(
            name: "Check",
            platforms: [.iOS(.v13)],
            dependencies: [.package(url: "https://github.com/$SPM_REPO", exact: "$VERSION")],
            targets: [.target(name: "Check", dependencies: [.product(name: "DeepdotsSDK", package: "DeepdotsSDK-SPM")])]
          )
          EOF
          cd "$CHECK" && swift package resolve
          # Lo que descarga quien instala por SPM es el zip probado, byte a byte.
          URL="https://github.com/$SPM_REPO/releases/download/$VERSION/DeepdotsSDK-$VERSION.xcframework.zip"
          PUBLISHED="$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)"
          if [ "$PUBLISHED" != "$checksum" ]; then
            echo "::error::El zip publicado en SPM ($PUBLISHED) no es el probado ($checksum)."
            exit 1
          fi

      # release.json definitivo: lo mismo que "Check traceability" + donde quedo publicado cada artefacto.
      - name: Release metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          MAVEN: ${{ steps.state.outputs.maven }}
          SPM: ${{ steps.state.outputs.spm }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/$ARTIFACT_GROUP_PATH/$VERSION/shared-android-$VERSION.pom")"
          if [ "$MAVEN" = "publish" ]; then MAVEN_STATE=published; elif [ "$CODE" = "200" ]; then MAVEN_STATE=existing; else MAVEN_STATE=not-published; fi
          if [ "$SPM" = "publish" ]; then SPM_STATE=published; else SPM_STATE=existing; fi
          node scripts/release/metadata.mjs --require-ci --tag "$GITHUB_REF_NAME" \
            --aar "$OUT/DeepdotsSDK-$VERSION.aar" --xcframework "$OUT/DeepdotsSDK-$VERSION.xcframework.zip" \
            --spm-checksum "$checksum" --maven-dir build/release-staging-repo --smoke "$RUNNER_TEMP/smoke.json" \
            --maven "$MAVEN_STATE" --spm "$SPM_STATE" --out "$OUT/release.json"
          cp release/compatibility.json release/config.schema.json "$OUT/"
          (cd "$OUT" && shasum -a 256 -- *.aar *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: GitHub Release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          MAVEN: ${{ steps.state.outputs.maven }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::La GitHub Release $GITHUB_REF_NAME ya existe."
            exit 0
          fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/$ARTIFACT_GROUP_PATH/$VERSION/shared-android-$VERSION.pom")"
          NOTES="$RUNNER_TEMP/notes.md"
          cp "$RUNNER_TEMP/changelog.md" "$NOTES"
          {
            echo
            echo "## Install"
            echo
            echo "iOS: Swift Package Manager, from [DeepdotsSDK-SPM](https://github.com/$SPM_REPO), version \`$VERSION\`."
            echo
            if [ "$MAVEN" = "publish" ] || [ "$CODE" = "200" ]; then
              echo "Android: Maven Central (it can take a few minutes to show up after the release)."
              echo
              echo '```kotlin'
              echo "implementation(\"com.deepdots.sdk:shared-android:$VERSION\")"
              echo '```'
            else
              echo "Android: attach the AAR below. This version is not on Maven Central; a bare AAR has no POM, so the host app has to declare the SDK's dependencies itself."
            fi
          } >> "$NOTES"
          OUT="$RUNNER_TEMP/out"
          FLAGS=(--latest)
          if [ "${{ steps.meta.outputs.latest }}" != "true" ]; then FLAGS=(--latest=false); fi
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          # La Release se crea de una vez con sus ficheros: con releases inmutables no se pueden
          # anadir despues.
          gh release create "$GITHUB_REF_NAME" \
            "$OUT/DeepdotsSDK-$VERSION.aar" "$OUT/DeepdotsSDK-$VERSION.xcframework.zip" "$OUT/SHA256SUMS" \
            "$OUT/release.json" "$OUT/compatibility.json" "$OUT/config.schema.json" \
            --title "$GITHUB_REF_NAME" --notes-file "$NOTES" --verify-tag "${FLAGS[@]}"
          echo "Publicada [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

      # Politica: tras cada release, `main` recibe lo publicado. Se fusiona el commit del TAG
      # (no la punta de dev, que puede ir por delante). Si hay conflicto, no se fuerza nada:
      # se abre una PR para resolverlo a mano.
      - name: Merge release into main
        # Un parche de una linea antigua no va a main: main tiene la ultima release.
        if: steps.meta.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git checkout -f -B main origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::notice::main ya contiene $GITHUB_REF_NAME."
            exit 0
          fi
          if git merge --no-ff "$GITHUB_SHA" -m "merge: release $GITHUB_REF_NAME de dev a main"; then
            git push origin main
            echo "::notice::$GITHUB_REF_NAME fusionada en main."
            # Un push hecho con GITHUB_TOKEN no dispara otros workflows: la doc se lanza a mano.
            gh workflow run docs-pages.yml --ref main
          else
            git merge --abort
            BRANCH="release-to-main/$GITHUB_REF_NAME"
            git push -f origin "$GITHUB_SHA:refs/heads/$BRANCH"
            # Abrir la PR exige "Allow GitHub Actions to create and approve pull requests" en
            # Settings > Actions > General. Sin esa opcion, la rama queda subida y se avisa.
            if gh pr create --base main --head "$BRANCH" \
              --title "Release $GITHUB_REF_NAME: dev a main" \
              --body "El merge automatico de $GITHUB_REF_NAME en main ha dado conflicto. Resuelvelo en esta PR."; then
              echo "::warning::Conflicto al fusionar $GITHUB_REF_NAME en main: abierta una PR para resolverlo."
            else
              echo "::error::Conflicto al fusionar $GITHUB_REF_NAME en main. Abre a mano una PR de $BRANCH a main."
              exit 1
            fi
          fi
