# Negative control (MF-3263): the rating bug a client saw on SDK 0.7.0 / Android.
# 0.7.0 rendered the survey with its vendored @magicfeedback/native 2.2.4, which puts the scale
# labels inside the first and last chips ("1 = Meget dårlig"). From 0.7.1 the chips read 1..5 and
# the labels sit under the scale. Must FAIL on 0.7.0 and PASS on 0.7.3 (negative-control.sh).
# Copied into test-apps/maestro/client-replica/ by the workflow, so the paths are relative to that folder.
# env: REPLICA_SCENARIO (default client-replica: replica of a client popup in MAGICFEEDBACK_DEV, time_on_page 5 s,
# segments.lang ["en"] like the client prod popup, survey only in Danish)
appId: com.deepdots.testapp
tags: [client-replica, negative-control]
---
- runFlow:
    file: subflows/launch.yaml
    env:
      SCENARIO: ${REPLICA_SCENARIO || 'client-replica'}
      # en, not da: the popup is segmented to en (as in prod) and 0.7.4 applies segments.lang.
      # The survey only exists in Danish, so it still renders in Danish.
      LANG: en
# time_on_page 5 s + survey load.
- extendedWaitUntil:
    visible: ".*Meget dårlig.*"
    timeout: 30000
- takeScreenshot: client-replica-rating
- assertNotVisible: "1 = .*"
- assertNotVisible: "5 = .*"
- assertVisible: "1"
- assertVisible: "5"
- assertVisible: "Meget dårlig"
- assertVisible: "Meget god"
