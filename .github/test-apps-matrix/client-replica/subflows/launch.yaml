# Launch for the client replica flows: like test-apps/maestro/subflows/launch.yaml but without its DEV / scenario label
# checks. The replica popup fires after 5 s on any path ("/"), so on a slow simulator (seen on the
# iPad) it can already cover those labels when they are checked. The scenario label is not checked
# either: on iOS 16 the cookies alert hides the app's accessibility tree, so the header is not
# "visible" to Maestro (seen on the iPhone SE 16.4). The client replica flows check the scenario indirectly:
# its Danish survey only exists in the client replicas.
# env: SCENARIO (required), LANG
appId: com.deepdots.testapp
---
- launchApp:
    clearState: true
    arguments:
      scenario: ${SCENARIO}
      nav: history
      lang: ${LANG || 'en'}
      start: home
      load: immediate
- extendedWaitUntil:
    visible: "Accept all"
    timeout: 90000
    optional: true
# On a busy CI emulator Android sometimes kills the new process right after clearState
# ("Destroy timeout of remove-task ... failed to attach") and nothing restarts it: launch again
# (same as test-apps/maestro/subflows/launch.yaml; seen on the Pixel Tablet API 34, 0.7.11).
- runFlow:
    when:
      notVisible: "Accept all"
    commands:
      - launchApp:
          clearState: true
          arguments:
            scenario: ${SCENARIO}
            nav: history
            lang: ${LANG || 'en'}
            start: home
            load: immediate
      - extendedWaitUntil:
          visible: "Accept all"
          timeout: 120000
- tapOn: "Accept all"
