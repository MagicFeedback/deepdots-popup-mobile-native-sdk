# NORDLY test app for iOS (MF-3244). Generate with:
#   SDK_VERSION=0.7.3 xcodegen generate
# The SDK comes from the published Swift package (MagicFeedback/DeepdotsSDK-SPM) at that exact version.
name: NordlyTestApp
options:
  bundleIdPrefix: com.deepdots
  deploymentTarget:
    iOS: "16.0"
packages:
  DeepdotsSDK:
    url: https://github.com/MagicFeedback/DeepdotsSDK-SPM
    exactVersion: ${SDK_VERSION}
settings:
  base:
    LAB_SDK_VERSION: ${SDK_VERSION}
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NordlyTestApp:
    type: application
    platform: iOS
    sources:
      - NordlyTestApp
      - path: ../scenarios.json
        buildPhase: resources
    dependencies:
      - package: DeepdotsSDK
        product: ComposeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepdots.testapp
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
        # The XCFramework has no x86_64 simulator slice (compatibility.json): arm64 only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: NordlyTestApp/Info.plist
      properties:
        CFBundleDisplayName: NORDLY
        LabSDKVersion: $(LAB_SDK_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  NordlyTestApp:
    build:
      targets:
        NordlyTestApp: all
