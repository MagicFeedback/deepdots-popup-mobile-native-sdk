# Visual regression (DD-28): popup at the bottom: home indicator safe area. Same DEV scenario as e2e/position-bottom.yaml.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [visual]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      SCENARIO: e2e-position-bottom
- runFlow:
    file: ../subflows/lab-tap.yaml
    env:
      ID: lab-event-e2e_position
- extendedWaitUntil:
    visible: "E2E · Bottom left"
    timeout: 20000
# The title is in the accessibility tree before the popup is revealed: wait for the survey too.
- runFlow:
    file: ../subflows/wait-survey.yaml
    env:
      QUESTION: "How likely are you to recommend NORDLY to a friend?"
- extendedWaitUntil:
    visible: "Send"
    timeout: 15000
- runFlow:
    file: ../subflows/visual-shot.yaml
    env:
      NAME: position-bottom
