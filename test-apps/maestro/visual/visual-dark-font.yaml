# Visual regression (DD-28): dark theme and custom font (typography, colours). Same DEV scenario as e2e/dark-font.yaml.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [visual]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      SCENARIO: e2e-dark-font
- runFlow:
    file: ../subflows/lab-tap.yaml
    env:
      ID: lab-event-e2e_style
- extendedWaitUntil:
    visible: "E2E · Dark theme and custom font"
    timeout: 20000
# The survey must be there before the screenshot: mandatory wait (wait-survey's is optional,
# and on a slow CI runner the popup can be revealed before the survey loads).
- extendedWaitUntil:
    visible: "How likely are you to recommend NORDLY to a friend?"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Send"
    timeout: 15000
- runFlow:
    file: ../subflows/visual-shot.yaml
    env:
      NAME: dark-font
