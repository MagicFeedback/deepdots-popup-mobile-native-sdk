# Visual regression (DD-28): dark theme and custom font (typography, colours). Same DEV scenario as e2e/dark-font.yaml.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [visual]
---
- runFlow:
    file: ../subflows/launch-no-dialog.yaml
    env:
      SCENARIO: e2e-dark-font
- runFlow:
    file: ../subflows/lab-tap.yaml
    env:
      ID: lab-event-e2e_style
- extendedWaitUntil:
    visible: "E2E · Dark theme and custom font"
    timeout: 20000
# The title is in the accessibility tree before the popup is revealed: wait for the survey too.
- runFlow:
    file: ../subflows/wait-survey.yaml
    env:
      QUESTION: "How likely are you to recommend NORDLY to a friend?"
- extendedWaitUntil:
    visible: "Send"
    timeout: 15000
- runFlow:
    file: ../subflows/visual-shot.yaml
    env:
      NAME: dark-font
