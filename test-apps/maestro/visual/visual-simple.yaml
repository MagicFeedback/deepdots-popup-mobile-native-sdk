# Visual regression (DD-28): the simple survey (help-click), first page: the NPS scale.
appId: com.deepdots.testapp
tags: [visual]
---
- runFlow:
    file: ../subflows/launch-no-dialog.yaml
    env:
      SCENARIO: help-click
- tapOn:
    id: tab-account
- tapOn:
    id: help-button
- extendedWaitUntil:
    visible: "Can we help?"
    timeout: 20000
- runFlow:
    file: ../subflows/wait-survey.yaml
    env:
      QUESTION: "How likely are you to recommend NORDLY to a friend?"
- runFlow:
    file: ../subflows/visual-shot.yaml
    env:
      NAME: simple-1-open
