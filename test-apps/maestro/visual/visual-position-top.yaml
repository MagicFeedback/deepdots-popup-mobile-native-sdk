# Visual regression (DD-28): popup at the top: safe area under the status bar. Same DEV scenario as e2e/position-top.yaml.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [visual]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      VISUAL: "1"
      SCENARIO: e2e-position-top
- runFlow:
    file: ../subflows/lab-tap.yaml
    env:
      ID: lab-event-e2e_position
- extendedWaitUntil:
    visible: "E2E · Top right"
    timeout: 20000
# The survey must be there before the screenshot: mandatory wait (wait-survey's is optional,
# and on a slow CI runner the popup can be revealed before the survey loads).
- extendedWaitUntil:
    visible: "How likely are you to recommend NORDLY to a friend?"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Send"
    timeout: 15000
- runFlow:
    file: ../subflows/visual-shot.yaml
    env:
      NAME: position-top
