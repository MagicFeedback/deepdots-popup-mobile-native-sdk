# The X of a popup whose title wraps to two lines: it has to be there and close the popup.
# Runs with large system text (`text-size`) so the title wraps on every device.
# KNOWN ISSUE (found by MF-3270, SDK 0.7.5): the title took the whole header row and the X was
# drawn 0 px wide. Fixed after 0.7.5.
# - Android: the 0 px X is not in the tree, so the flow fails up to 0.7.5 (known issue).
# - iOS: Maestro cannot see it: Compose keeps the X's 48 pt touch target, so "Close popup" is in
#   the tree, at the same place, and closes the popup (checked: same result on 0.7.5 and on the
#   fix). There the flow guards the close path; the drawing is checked by eye in its screenshot.
# text-size: large
# known-issue-until-android: 0.7.5
appId: com.deepdots.testapp
tags: [known-issue]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      SCENARIO: rate-product
- tapOn:
    id: tab-shop
- tapOn:
    id: product-fjell-jacket
- tapOn:
    id: rate-product
- tapOn:
    id: star-5
- tapOn:
    id: submit-rating
- extendedWaitUntil:
    visible: "Tell us what you think of this product"
    timeout: 15000
- extendedWaitUntil:
    visible: "Close popup"
    timeout: 10000
# Wait for the survey before tapping: if it arrives later, the card grows and re-centres and the
# X moves under the tap (PR #51). Optional: Android may not expose the WebView's text.
- extendedWaitUntil:
    visible: "Did you find what you were looking for?"
    timeout: 15000
    optional: true
- takeScreenshot: rate-product-close
- tapOn:
    text: "Close popup"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Tell us what you think of this product"
