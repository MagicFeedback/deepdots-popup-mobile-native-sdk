# release/fixtures/popups (MF-3242), served by the DEV API, shown with their host events.
appId: com.deepdots.testapp
tags: [smoke]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      SCENARIO: release-fixtures
- tapOn:
    id: lab-open
- scrollUntilVisible:
    element:
      id: lab-event-fixture_minimal
    direction: DOWN
- tapOn:
    id: lab-event-fixture_minimal
- extendedWaitUntil:
    visible: "Quick question"
    timeout: 15000
