# Audience segmentation by language: only the popup for the app language shows.
# KNOWN ISSUE (found by MF-3244, SDK 0.7.3): the native SDK parses segments.lang but never
# filters by it (DeepdotsPopups.shouldShow only checks path / excludedPaths), so with lang=es it
# shows the popup segmented for "en". The web SDK filters correctly. Expected to fail until the
# SDK is fixed; the runner turns red when it starts passing, so the tag can be removed.
appId: com.deepdots.testapp
tags: [known-issue]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      SCENARIO: audience-lang
      LANG: es
- tapOn:
    id: tab-shop
- tapOn:
    id: product-fjell-jacket
- tapOn:
    id: rate-product
- tapOn:
    id: submit-rating
- extendedWaitUntil:
    visible: "Valora este producto (público ES)"
    timeout: 15000
- assertNotVisible: "Rate this product (EN audience)"
