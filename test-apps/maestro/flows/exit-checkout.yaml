# exit trigger: leaving /checkout shows the popup on the destination screen.
# Also used by the failure test with NAV=silent (expected to fail there).
appId: com.deepdots.testapp
tags: [smoke]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      SCENARIO: exit-checkout
      NAV: ${NAV || 'history'}
- tapOn:
    id: tab-cart
- tapOn:
    id: go-checkout
- assertVisible:
    id: place-order
- tapOn:
    id: back
- extendedWaitUntil:
    visible: "Why did you leave the checkout?"
    timeout: 12000
- takeScreenshot: exit-checkout
