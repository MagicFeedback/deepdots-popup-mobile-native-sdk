# Lifecycle with the popup open: background and back. The app comes back usable, the popup (if
# still there) can be closed, and no second popup appears.
appId: com.deepdots.testapp
tags: [regression]
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      SCENARIO: help-click
- tapOn:
    id: tab-account
- tapOn:
    id: help-button
- extendedWaitUntil:
    visible: "Can we help?"
    timeout: 15000
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 2000
- launchApp:
    clearState: false
    stopApp: false
- assertVisible:
    text: ".*life foreground.*"
- takeScreenshot: background-open-popup-back
- runFlow:
    file: ../subflows/close-popup.yaml
    env:
      TITLE: "Can we help?"
- assertVisible:
    id: lab-counts
    text: "shown 1 · done 0"
- runFlow: ../subflows/host-usable.yaml
