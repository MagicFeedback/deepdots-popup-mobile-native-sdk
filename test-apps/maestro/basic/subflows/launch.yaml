# Fresh launch of the minimal host app: the client popup opens by itself at app start.
appId: com.deepdots.basicapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Basic app · SDK.*"
    timeout: 60000
# The X is native and always in the accessibility tree; Android exposes the survey's WebView
# text later and not always, so the question is only waited for.
- extendedWaitUntil:
    visible: "Luk pop op"
    timeout: 30000
- extendedWaitUntil:
    visible: "Hvordan vil du vurdere.*"
    timeout: 10000
    optional: true
