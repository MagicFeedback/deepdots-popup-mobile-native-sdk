# Minimal host (init + attachContext + setPath("/") only): the client popup opens by itself at
# app start, ONCE, and closes; the app is left as it was.
# The client setup is validated from 0.7.6; older versions predate the fixes it relies on.
# min-sdk: 0.7.6
appId: com.deepdots.basicapp
tags: [basic]
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: ../subflows/close-popup.yaml
    env:
      TITLE: "Hvordan vil du vurdere din oplevelse med appen?"
      CLOSE_LABEL: "Luk pop op"
- extendedWaitUntil:
    visible: "Hvordan vil du vurdere din oplevelse med appen?"
    timeout: 10000
    optional: true
- assertNotVisible: "Hvordan vil du vurdere din oplevelse med appen?"
- assertVisible: "Basic app · SDK.*"
