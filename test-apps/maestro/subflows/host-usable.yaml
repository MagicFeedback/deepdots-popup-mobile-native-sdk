# The host app still works: real taps through the tabs, a product and the cart.
appId: com.deepdots.testapp
---
- tapOn:
    id: tab-shop
# Right after a rapid navigation (time-cancel) the first tab tap can be swallowed by the screen
# transition still settling (seen on the iPhone SE): tap again if Shop did not open.
- runFlow:
    when:
      notVisible:
        id: product-ull-socks
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: tab-shop
# On a small screen (iPhone SE) the product can be below the fold.
- scrollUntilVisible:
    element:
      id: product-ull-socks
    direction: DOWN
    timeout: 10000
- tapOn:
    id: product-ull-socks
- tapOn:
    id: add-to-cart
- tapOn:
    id: tab-cart
- assertVisible:
    id: cart-count
    text: 3 items
- tapOn:
    id: go-checkout
- assertVisible:
    id: place-order
