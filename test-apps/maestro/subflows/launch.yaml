# Fresh launch (clean state) of one scenario, cookie dialog accepted.
# env: SCENARIO (required), NAV, LANG, START
appId: com.deepdots.testapp
---
- launchApp:
    clearState: true
    arguments:
      scenario: ${SCENARIO}
      nav: ${NAV || 'history'}
      lang: ${LANG || 'en'}
      start: ${START || 'home'}
      load: immediate
# First launch on a CI emulator can be very slow before the first frame.
- extendedWaitUntil:
    visible: "Accept all"
    timeout: 120000
    optional: true
# A system "isn't responding" dialog (busy CI emulator) can cover the app: keep waiting.
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
      - extendedWaitUntil:
          visible: "Accept all"
          timeout: 60000
- tapOn: "Accept all"
- assertVisible:
    id: lab-env
    text: DEV
- assertVisible:
    id: lab-scenario
    text: ${SCENARIO}
