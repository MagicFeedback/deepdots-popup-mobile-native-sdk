# A host dialog in front at app start (the cookie dialog), left there longer than the popup's
# 5 s timer: the popup waits behind it and opens ONCE after the dialog is answered.
appId: com.deepdots.testapp
tags: [lemu]
---
- launchApp:
    clearState: true
    arguments:
      scenario: client-exact-launch
      nav: history
      lang: en
      start: home
      load: immediate
- extendedWaitUntil:
    visible: "Accept all"
    timeout: 90000
# The 5 s timer fires while the dialog is still up.
- extendedWaitUntil:
    visible: "never-shown-marker"
    timeout: 9000
    optional: true
- assertVisible: "Accept all"
- tapOn: "Accept all"
- extendedWaitUntil:
    visible: "Hvordan vil du vurdere din oplevelse med appen?"
    timeout: 30000
- runFlow:
    file: ../subflows/close-popup.yaml
    env:
      TITLE: "Hvordan vil du vurdere din oplevelse med appen?"
      CLOSE_LABEL: "Luk pop op"
- assertVisible:
    id: lab-counts
    text: "shown 1 · done 0"
- extendedWaitUntil:
    visible: "Hvordan vil du vurdere din oplevelse med appen?"
    timeout: 10000
    optional: true
- assertNotVisible: "Hvordan vil du vurdere din oplevelse med appen?"
