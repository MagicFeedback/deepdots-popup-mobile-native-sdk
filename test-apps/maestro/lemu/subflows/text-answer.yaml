# Answers a free-text question of the client survey and sends it. The client's text questions
# have AI follow-ups: a generated question may come next (its text varies), so while a text box
# is still on screen after sending, it is answered too (at most two follow-ups).
# env: QUESTION (the text question), ANSWER, NEXT (the question expected after it)
appId: com.deepdots.testapp
---
- extendedWaitUntil:
    visible: ${QUESTION}
    timeout: 15000
- tapOn: "Skriv dit svar her..."
- inputText: ${ANSWER}
- runFlow: send.yaml
- extendedWaitUntil:
    visible: ${NEXT}
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: ${NEXT}
      visible: "Skriv dit svar her..."
    commands:
      - tapOn: "Skriv dit svar her..."
      - inputText: "More detail from the automated test"
      - runFlow: send.yaml
      - extendedWaitUntil:
          visible: ${NEXT}
          timeout: 20000
          optional: true
- runFlow:
    when:
      notVisible: ${NEXT}
      visible: "Skriv dit svar her..."
    commands:
      - tapOn: "Skriv dit svar her..."
      - inputText: "Even more detail from the automated test"
      - runFlow: send.yaml
- extendedWaitUntil:
    visible: ${NEXT}
    timeout: 20000
