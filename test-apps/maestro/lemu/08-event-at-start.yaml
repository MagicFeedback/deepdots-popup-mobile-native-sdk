# The client's current setup: the popup on an event, fired at app start right after the first
# setPath() (the screen must be known first, as the integration guide asks), before the popups
# have arrived: the SDK keeps it and shows the popup once they load.
# The client setup is validated from 0.7.6; older versions predate the fixes it relies on.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [lemu]
---
- runFlow:
    file: ../subflows/launch-no-dialog.yaml
    env:
      SCENARIO: client-exact
      EVENT: jhgjgjhg
- extendedWaitUntil:
    visible: "Hvordan vil du vurdere din oplevelse med appen?"
    timeout: 30000
- runFlow:
    file: ../subflows/close-popup.yaml
    env:
      TITLE: "Hvordan vil du vurdere din oplevelse med appen?"
      CLOSE_LABEL: "Luk pop op"
- assertVisible:
    id: lab-scenario
    text: client-exact
- assertVisible:
    id: lab-env
    text: DEV
- assertVisible:
    id: lab-counts
    text: "shown 1 · done 0"
- runFlow: ../subflows/host-usable.yaml
