# Full answer, rating 5 and every "yes": rating → its text question (+ AI follow-up) → yes/no →
# text → yes/no → email (invalid first: the survey refuses it) → thank you → done.
# The client setup is validated from 0.7.6; older versions predate the fixes it relies on.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [lemu]
---
- runFlow: subflows/open-popup.yaml
- runFlow:
    file: subflows/tap.yaml
    env:
      OPTION: "5"
- runFlow: subflows/send.yaml
- runFlow:
    file: subflows/text-answer.yaml
    env:
      QUESTION: "Vi er meget glade for at høre.*"
      ANSWER: "Automated test: rating 5"
      NEXT: "Er der andet, vi kan gøre for at forbedre din oplevelse?"
# Required yes/no without an answer: refused, and Back IS there (there is a previous page).
- runFlow: subflows/send.yaml
- assertVisible: "Please answer the required question to continue."
- assertVisible: "Tilbage"
- runFlow:
    file: subflows/tap.yaml
    env:
      OPTION: "Ja"
- runFlow: subflows/send.yaml
- runFlow:
    file: subflows/text-answer.yaml
    env:
      QUESTION: "Hvad kan vi gøre for at forbedre din oplevelse i vores app?"
      ANSWER: "Automated test: improvement"
      NEXT: "Må vi kontakte dig, hvis vi gerne vil høre mere om din feedback?"
- runFlow:
    file: subflows/tap.yaml
    env:
      OPTION: "Ja"
- runFlow: subflows/send.yaml
- extendedWaitUntil:
    visible: "Indtast venligst din e-mailadresse."
    timeout: 15000
- tapOn:
    text: "you@example.com"
    optional: true
- inputText: "not-an-email"
- runFlow: subflows/send.yaml
- assertVisible: "Indtast venligst din e-mailadresse."
# An email with a typo: "Please enter a valid email address." from surveys SDK 2.2.39 on
# (INVALID_EMAIL); the published 0.7.x on 2.2.31 still say "required question".
- assertVisible: "Please (enter a valid email address|answer the required question to continue)\\."
- tapOn: "not-an-email"
- eraseText: 20
- inputText: "qa+lemu-test@deepdots.com"
- runFlow: subflows/send.yaml
- runFlow: subflows/finish.yaml
