# Cooldown COMPLETED (1 day): answered to the end, the same event does not show it again.
# E2E scenario in MAGICFEEDBACK_DEV (scenarios.json). Needs the scenario in the app build.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [e2e]
---
- runFlow:
    file: ../subflows/launch-no-dialog.yaml
    env:
      SCENARIO: e2e-cooldown-completed
- runFlow:
    file: ../subflows/lab-tap.yaml
    env:
      ID: lab-event-e2e_completed
- extendedWaitUntil:
    visible: "How likely are you to recommend NORDLY to a friend?"
    timeout: 20000
- runFlow:
    file: ../lemu/subflows/tap.yaml
    env:
      OPTION: "5"
- extendedWaitUntil:
    visible: "0/500"
    timeout: 10000
    optional: true
- inputText: "E2E cooldown completed"
- runFlow: ../lemu/subflows/send.yaml
- extendedWaitUntil:
    visible: "Complete survey"
    timeout: 20000
- tapOn: "Complete survey"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: lab-counts
    text: "shown 1 · done 1"
- runFlow:
    file: ../subflows/lab-tap.yaml
    env:
      ID: lab-event-e2e_completed
- extendedWaitUntil:
    visible: "How likely are you to recommend NORDLY to a friend?"
    timeout: 10000
    optional: true
- assertNotVisible: "How likely are you to recommend NORDLY to a friend?"
- assertVisible:
    id: lab-counts
    text: "shown 1 · done 1"
