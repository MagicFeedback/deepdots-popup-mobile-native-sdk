# Style: E2E · Top right. Shows, can be read and closed; screenshot for the layout.
# KNOWN ISSUE on iOS (found 3-nov, 0.7.8): a tall popup at the top goes under the status bar and
# its X cannot be tapped (top safe area ignored). Not fixed yet.
# known-issue-until-ios: 0.7.8
# E2E scenario in MAGICFEEDBACK_DEV (scenarios.json). Needs the scenario in the app build.
# min-sdk: 0.7.6
appId: com.deepdots.testapp
tags: [e2e, known-issue]
---
- runFlow:
    file: ../subflows/launch-no-dialog.yaml
    env:
      SCENARIO: e2e-position-top
- runFlow:
    file: ../subflows/lab-tap.yaml
    env:
      ID: lab-event-e2e_position
- extendedWaitUntil:
    visible: "E2E · Top right"
    timeout: 20000
- assertVisible: "Close popup"
- takeScreenshot: e2e-position-top
- runFlow:
    file: ../subflows/close-popup.yaml
    env:
      TITLE: "E2E · Top right"
- assertVisible:
    id: lab-counts
    text: "shown 1 · done 0"
- runFlow: ../subflows/host-usable.yaml
